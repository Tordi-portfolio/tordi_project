<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porosity Calculator</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f1a;
            color: white;
        }

        /* HEADER */
        .header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(90deg, #0f172a, #1e3a8a);
            font-size: 20px;
            font-weight: bold;
        }

        /* MAIN CONTAINER */
        .container {
            width: 100%;
            max-width: 750px;
            margin: 30px auto;
            background: #111827;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #1f2937;
        }

        label {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #3b82f6;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: #2563eb;
        }

        /* RESULT BOX */
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #0f172a;
            border-left: 4px solid #3b82f6;
            border-radius: 6px;
        }

        /* CHART CONTAINER (IMPORTANT FIX) */
        .chart-box {
            margin-top: 30px;
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1f2937;

            height: 380px;
            position: relative;
        }

        .chart-box canvas {
            width: 100% !important;
            height: 100% !important;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #00d4ff;
            text-decoration: none;
        }

        /* ===== TABLET ===== */
        @media (max-width: 1024px) {
            .container {
                max-width: 90%;
            }
        }

        /* ===== MOBILE ===== */
        @media (max-width: 600px) {
            .container {
                margin: 15px;
                padding: 15px;
            }

            .header {
                font-size: 16px;
                padding: 15px;
            }

            .chart-box {
                height: 300px;
            }
        }
    </style>
</head>

<body>

<div class="header">🪨 Porosity Calculator (Density Log Method)</div>

<div class="container">

    <form method="POST">
        {% csrf_token %}

        <label>Matrix Density (ρma)</label>
        <input type="number" name="rho_ma" step="any" required>

        <label>Fluid Density (ρf)</label>
        <input type="number" name="rho_f" step="any" required>

        <label>Bulk Density (ρb)</label>
        <input type="number" name="rho_b" step="any" required>

        <button type="submit">Calculate Porosity</button>
    </form>

    {% if result %}
    <div class="result">
        <strong>Porosity Result:</strong><br>
        {{ result }}
    </div>
    {% endif %}

    <!-- CHART -->
    <div class="chart-box">
        <canvas id="porosityChart"></canvas>
    </div>

    <a href="{% url 'logs:analysis_home' %}">⬅ Back to Dashboard</a>

</div>

<!-- SAFE JSON DATA -->
{{ bulk_values|json_script:"bulk-data" }}
{{ porosity_values|json_script:"poro-data" }}

<script>
document.addEventListener("DOMContentLoaded", function () {

    const bulkValues = JSON.parse(document.getElementById("bulk-data")?.textContent || "[]");
    const porosityValues = JSON.parse(document.getElementById("poro-data")?.textContent || "[]");

    const canvas = document.getElementById("porosityChart");

    if (bulkValues.length > 0 && porosityValues.length > 0 && canvas) {

        new Chart(canvas, {
            type: "line",
            data: {
                labels: bulkValues,
                datasets: [{
                    label: "Porosity vs Bulk Density",
                    data: porosityValues,
                    borderColor: "#3b82f6",
                    backgroundColor: "rgba(59,130,246,0.1)",
                    borderWidth: 3,
                    tension: 0.35,
                    fill: true,
                    pointRadius: 4,
                    pointBackgroundColor: "#3b82f6"
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,

                plugins: {
                    legend: {
                        labels: {
                            color: "#e2e8f0"
                        }
                    },
                    title: {
                        display: true,
                        text: "Porosity vs Bulk Density Relationship",
                        color: "#e2e8f0"
                    }
                },

                scales: {
                    x: {
                        grid: {
                            color: "rgba(255,255,255,0.05)"
                        },
                        ticks: {
                            color: "#cbd5e1"
                        },
                        title: {
                            display: true,
                            text: "Bulk Density (ρb)",
                            color: "#cbd5e1"
                        }
                    },
                    y: {
                        grid: {
                            color: "rgba(255,255,255,0.05)"
                        },
                        ticks: {
                            color: "#cbd5e1"
                        },
                        title: {
                            display: true,
                            text: "Porosity (φ)",
                            color: "#cbd5e1"
                        }
                    }
                }
            }
        });

    }

});
</script>

</body>
</html>
