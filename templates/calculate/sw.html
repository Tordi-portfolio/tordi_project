<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Saturation</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f1a;
            color: white;
        }

        /* HEADER */
        .header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(90deg, #0f172a, #0ea5e9);
            font-size: 20px;
            font-weight: bold;
        }

        /* MAIN CONTAINER */
        .container {
            width: 100%;
            max-width: 750px;
            margin: 30px auto;
            background: #111827;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #1f2937;
        }

        label {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #0ea5e9;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: #0284c7;
        }

        /* RESULT BOX */
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #0f172a;
            border-left: 4px solid #0ea5e9;
            border-radius: 6px;
        }

        /* CHART BOX (IMPORTANT FIX) */
        .chart-box {
            margin-top: 30px;
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1f2937;

            height: 380px;
            position: relative;
        }

        .chart-box canvas {
            width: 100% !important;
            height: 100% !important;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #00d4ff;
            text-decoration: none;
        }

        /* ===== TABLET ===== */
        @media (max-width: 1024px) {
            .container {
                max-width: 90%;
            }
        }

        /* ===== MOBILE ===== */
        @media (max-width: 600px) {
            .container {
                margin: 15px;
                padding: 15px;
            }

            .header {
                font-size: 16px;
                padding: 15px;
            }

            .chart-box {
                height: 300px;
            }
        }
    </style>
</head>

<body>

<div class="header">💧 Water Saturation (Archie Equation)</div>

<div class="container">

    <form method="POST">
        {% csrf_token %}

        <label>Rw</label>
        <input type="number" step="any" name="rw" required>

        <label>Rt</label>
        <input type="number" step="any" name="rt" required>

        <label>Porosity (φ)</label>
        <input type="number" step="any" name="phi" required>

        <label>a</label>
        <input type="number" step="any" name="a" required>

        <label>m</label>
        <input type="number" step="any" name="m" required>

        <label>n</label>
        <input type="number" step="any" name="n" required>

        <button type="submit">Calculate Sw</button>
    </form>

    {% if result %}
    <div class="result">
        <strong>Water Saturation:</strong><br>
        {{ result }}
    </div>
    {% endif %}

    <!-- BEAUTIFUL GRAPH -->
    <div class="chart-box">
        <canvas id="swChart"></canvas>
    </div>

    <a href="{% url 'logs:analysis_home' %}">⬅ Back to Dashboard</a>

</div>

<!-- SAFE JSON DATA -->
{{ phi_values|json_script:"phi-data" }}
{{ sw_values|json_script:"sw-data" }}

<script>
document.addEventListener("DOMContentLoaded", function () {

    const phiValues = JSON.parse(document.getElementById("phi-data")?.textContent || "[]");
    const swValues = JSON.parse(document.getElementById("sw-data")?.textContent || "[]");

    const canvas = document.getElementById("swChart");

    if (phiValues.length > 0 && swValues.length > 0 && canvas) {

        new Chart(canvas, {
            type: "line",
            data: {
                labels: phiValues,
                datasets: [{
                    label: "Archie Equation Analysis",
                    data: swValues,
                    borderColor: "#00d4ff",
                    backgroundColor: "rgba(0,212,255,0.08)",
                    borderWidth: 3,
                    fill: true,
                    tension: 0.35,
                    pointRadius: 4,
                    pointBackgroundColor: "#00d4ff"
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,

                plugins: {
                    legend: {
                        labels: {
                            color: "#e2e8f0"
                        }
                    },
                    title: {
                        display: true,
                        text: "Water Saturation vs Porosity Relationship (Archie’s Law)",
                        color: "#e2e8f0"
                    }
                },

                scales: {
                    x: {
                        grid: {
                            color: "rgba(255,255,255,0.05)"
                        },
                        ticks: {
                            color: "#cbd5e1"
                        },
                        title: {
                            display: true,
                            text: "Porosity (φ)",
                            color: "#cbd5e1"
                        }
                    },
                    y: {
                        grid: {
                            color: "rgba(255,255,255,0.05)"
                        },
                        ticks: {
                            color: "#cbd5e1"
                        },
                        title: {
                            display: true,
                            text: "Water Saturation (Sw)",
                            color: "#cbd5e1"
                        }
                    }
                }
            }
        });

    }

});
</script>

</body>
</html>
